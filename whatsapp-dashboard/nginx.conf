server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does NOT inherit add_header into a location that declares its
        # own, so the server-level security headers at the bottom of this file
        # were silently dropped for every .js/.css/image response. Repeated
        # here deliberately — keep the two lists in sync.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SSE stream (GET /api/events) — long-lived connection, needs buffering
    # disabled and a long read timeout or nginx will hang/drop it, unlike a
    # normal request/response API call.
    location /api/events {
        proxy_pass http://backend:3000/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Backend API — proxied to the backend container by its Docker network
    # alias (see docker-compose.yml's app-network). Without this block every
    # /api/* call falls through to the SPA fallback below and gets index.html
    # back instead of JSON.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbound WhatsApp/Twilio/Dialog webhooks — same backend, same reason.
    location /webhook {
        proxy_pass http://backend:3000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health check — used by the deploy pipeline to confirm the
    # backend is actually up after a rebuild/restart.
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers.
    #
    # NOTE: nginx does not inherit these into any `location` that declares an
    # add_header of its own. The static-asset block above therefore repeats
    # them; if you add a header here, add it there too.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS. This container is served over HTTPS by the external
    # sunflower-nginx proxy, so tell browsers never to try plain HTTP again.
    # No `preload` — that is a one-way submission to a browser-vendor list and
    # should be a deliberate decision, not a side effect of a config edit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP. Every allowance below is here because something real needs it —
    # each was verified against the source, not guessed:
    #
    #   style-src 'unsafe-inline'  the dashboard styles every component with
    #                              inline JS style objects (53 of them, no CSS
    #                              modules). Dropping this unstyles the whole UI.
    #   img-src res.cloudinary.com the brand logos on Login.jsx and Sidebar.jsx
    #                              are hosted there.
    #   img-src/frame-src blob:    invoicePdf/quotationPdf build a Blob and
    #                              DocumentPreviewModal renders it in an
    #                              <iframe> via URL.createObjectURL, so the
    #                              browser's PDF viewer needs blob: framing.
    #   font-src data:             pdfFonts.js embeds .ttf as data URIs.
    #   style-src fonts.googleapis the Inter + JetBrains Mono stylesheet that
    #   font-src  fonts.gstatic    index.html links in its <head>. WITHOUT
    #                              BOTH, the browser blocks the stylesheet
    #                              ("Loading the stylesheet ... violates the
    #                              following Content Security Policy
    #                              directive") and the whole dashboard falls
    #                              back to the default system font. The
    #                              stylesheet is served from googleapis.com
    #                              but the .woff2 files it references come
    #                              from gstatic.com, so allowing only the
    #                              first still leaves the fonts unfetchable.
    #
    # script-src stays strict: the bundle is same-origin and loads no
    # third-party JS. connect-src 'self' covers both the API and the SSE
    # stream, which nginx proxies on this same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
